<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Shorts Bot</title>
  <style>
    :root {
      --bg: #faf9f7;
      --text: #1a1a1a;
      --muted: #5c5c5c;
      --accent: #8b4513;
      --card: #fff;
      --border: #e8e4df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      max-width: 36rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 1rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 1.25rem;
      margin-top: 1.5rem;
    }
    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>AI Shorts Bot</h1>
    <div class="card">
      <p>
        A personal tool that creates AI-generated devotional art short videos and uploads them
        to the owner&rsquo;s own YouTube channel. Single-user, not offered to the public.
      </p>
    </div>
  </main>
  <footer>
    <a href="privacy.html">Privacy Policy</a>
  </footer>
</body>
</html>
